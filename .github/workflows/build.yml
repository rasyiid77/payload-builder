name: Build Desktop Payload

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Binary
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o payload_desktop.exe main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-payload
          path: payload_desktop.exe
          
